<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff"><title>Mirage</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#17142a;--mu:#7b7893;--ac:#7c5cff;--me:var(--ac);--them:#ecebf5;--bd:#e4e2f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1c;--card:#191631;--tx:#f1efff;--mu:#9a96bb;--them:#242043;--bd:#2b2750}}
:root[data-theme="dark"]{--bg:#0f0d1c;--card:#191631;--tx:#f1efff;--mu:#9a96bb;--them:#242043;--bd:#2b2750}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
header h1{font-size:22px;letter-spacing:-.5px;flex:1}
main{flex:1;overflow-y:auto;padding:0 12px 12px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:10px 0 8px;border:0;background:none;color:var(--mu);font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer}
.row:active{background:var(--them)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--ac),#ff7ac6);flex:none}
.av.ring{outline:3px solid var(--ac);outline-offset:2px}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.card img{width:100%;border-radius:12px;margin-top:8px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px}
.stories div{text-align:center;font-size:11px;color:var(--mu);cursor:pointer;flex:none}
.fab{position:absolute;right:18px;bottom:76px;width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:26px;box-shadow:0 6px 20px #0004;cursor:pointer}
.over{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--them);align-self:flex-start;word-wrap:break-word}
.m.me{background:var(--me);color:#fff;align-self:flex-end}
.m img{max-width:100%;border-radius:10px;display:block}
.m i{display:block;font-size:10px;opacity:.6;font-style:normal;margin-top:2px}
.m.eph{animation:fade 15s linear forwards}
@keyframes fade{to{opacity:.25;filter:blur(2px)}}
.bar{display:flex;gap:6px;padding:8px;background:var(--card);border-top:1px solid var(--bd);align-items:center}
.bar input[type=text],textarea,input.f{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:22px;padding:10px 14px;font:inherit;outline:0;width:100%}
textarea{border-radius:14px;resize:none;margin-top:8px}
.ib{border:0;background:none;font-size:22px;cursor:pointer;padding:4px 6px;color:var(--tx)}
.send{background:var(--ac);color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px}
.emo{display:grid;grid-template-columns:repeat(8,1fr);padding:8px;background:var(--card);border-top:1px solid var(--bd)}
.emo span{font-size:24px;text-align:center;padding:4px;cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;padding:14px 6px;border-bottom:1px solid var(--bd)}
.sw small{display:block;color:var(--mu)}
.tg{width:50px;height:30px;border-radius:15px;background:var(--them);border:0;position:relative;cursor:pointer;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px #0004}
.tg.on{background:var(--ac)}.tg.on::after{left:23px}
.dots{display:flex;gap:10px;margin-top:8px}.dots span{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.btn{border:0;background:var(--ac);color:#fff;border-radius:22px;padding:10px 18px;font:inherit;cursor:pointer}
.sv{position:absolute;inset:0;z-index:9;display:grid;place-items:center;color:#fff;font-size:28px;text-align:center;padding:30px;font-weight:600}
.sv .p{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;height:3px;background:#fff5;border-radius:2px;overflow:hidden}
.sv .p i{display:block;height:100%;background:#fff;animation:pr 5s linear forwards}
@keyframes pr{from{width:0}to{width:100%}}
.sv small{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:16px;font-size:14px}
.hello{display:grid;place-items:center;height:100%;text-align:center;padding:24px}
.hello .logo{width:96px;height:96px;margin:auto}
.m audio{width:210px;max-width:100%;height:36px}.recdot{color:#e0457b;animation:bl 1s infinite;margin:0 8px}@keyframes bl{50%{opacity:.2}}
.lg{overflow:visible}.rp{fill:none;stroke:#0a3cff;stroke-width:2;transform-origin:32px 32px;opacity:0;animation:rp 2.4s ease-out infinite}.rp.r2{animation-delay:1.2s;stroke:#4d8dff}@keyframes rp{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.9);opacity:0}}.fl{transform-origin:32px 32px;animation:fl 1.6s ease-in-out infinite alternate}@keyframes fl{from{filter:drop-shadow(0 0 3px #0a3cff99);transform:scale(1)}to{filter:drop-shadow(0 0 9px #4d8dffdd);transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){.rp,.fl{animation:none}}
</style>
</head><body><div id="app"></div><div id="rc"></div>

=== RÈGLES FIREBASE (copie-les dans la console) ===
rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function me(){ return request.auth != null; }
    match /users/{u} {
      allow read: if me();
      allow write: if me() && request.auth.uid == u;
    }
    match /chats/{c} {
      allow read, update: if me() && request.auth.uid in resource.data.members;
      allow create: if me() && request.auth.uid in request.resource.data.members;
      match /messages/{m} {
        allow read: if me() && request.auth.uid in get(/databases/$(db)/documents/chats/$(c)).data.members;
        allow create: if me() && request.auth.uid in get(/databases/$(db)/documents/chats/$(c)).data.members
                      && request.resource.data.from == request.auth.uid
                      && (!('text' in request.resource.data) || request.resource.data.text.size() < 2000);
      }
    }
    match /stories/{s} {
      allow read: if me();
      allow create: if me() && request.resource.data.uid == request.auth.uid;
      allow delete: if me() && resource.data.uid == request.auth.uid;
    }
    match /posts/{p} {
      allow read: if me();
      allow create: if me() && request.resource.data.uid == request.auth.uid;
      allow update: if me() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['likes','likedBy']);
      allow delete: if me() && resource.data.uid == request.auth.uid;
    }
  }
}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut,RecaptchaVerifier,signInWithPhoneNumber} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,setDoc,addDoc,updateDoc,query,where,orderBy,limit,onSnapshot,getDocs,serverTimestamp,increment,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
// Remplace par la config de ton projet : Console Firebase > Paramètres > Tes applications > Web
const firebaseConfig = {
  apiKey: "VOTRE_API_KEY",
  authDomain: "VOTRE_PROJET.firebaseapp.com",
  projectId: "VOTRE_PROJET",
  storageBucket: "VOTRE_PROJET.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:xxxxxxxx"
};


const app=initializeApp(firebaseConfig),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()}),st=getStorage(app);
const LOGO='<svg class="lg" viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0000ff"/><stop offset=".55" stop-color="#0a3cff"/><stop offset="1" stop-color="#4d8dff"/></linearGradient></defs><circle class="rp" cx="32" cy="32" r="30"/><circle class="rp r2" cx="32" cy="32" r="30"/><g class="fl"><rect width="64" height="64" rx="18" fill="url(#g)"/><path d="M14 44V22l9 12 9-12v22M38 44c0-8 6-12 12-12M38 36c0-6 5-9 10-9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>';
const ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0000ff"/><stop offset=".55" stop-color="#0a3cff"/><stop offset="1" stop-color="#4d8dff"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><path d="M14 44V22l9 12 9-12v22M38 44c0-8 6-12 12-12M38 36c0-6 5-9 10-9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const EMO=['😀','😂','🥹','😍','😎','🤯','🥳','😭','🙏','🔥','💜','✨','👍','👀','🎉','🫶','💬','🌈','🦋','🌙','⚡','🎧','📸','🍕'];
const COL=['#7c5cff','#ff5c8a','#18b67a','#ff9f1c','#1e90ff','#e0457b'],BG=COL.slice(0,5);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.getItem('mirage-s')||'null')||{accent:COL[0],sound:true,vib:true,dark:'auto',eph:false,aura:'😎'};
const saveS=()=>localStorage.setItem('mirage-s',JSON.stringify(S));
let me=null,tab='chats',cur=null,emoOn=false,compose=null,story=null,authMode='phone',err='';
let chats=[],msgs=[],stories=[],posts=[],unsubs=[],unsubMsgs=null,sbg=BG[0],pimg=null;
const ms=t=>t?.toMillis?.()??Date.now(),ago=t=>new Date(ms(t)).toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit'});

// --- Sons & vibrations ---
let ac;function beep(f=660,d=.08){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const vib=p=>{if(S.vib&&navigator.vibrate)navigator.vibrate(p)},fx=(f,p=12)=>{beep(f);vib(p)};
function theme(){const r=document.documentElement;r.style.setProperty('--ac',S.accent);S.dark==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.dark)}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.78)};i.src=r.result};r.readAsDataURL(file)})}
async function upload(file){const b=await shrink(file),r=ref(st,`u/${me.uid}/${Date.now()}.jpg`);await uploadBytes(r,b,{contentType:'image/jpeg'});return getDownloadURL(r)}

// --- Auth ---
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];me=u;
  if(u){
    await setDoc(doc(db,'users',u.uid),{name:u.displayName||(u.email?u.email.split('@')[0]:''),email:(u.email||'').toLowerCase(),phone:u.phoneNumber||'',aura:S.aura,seen:serverTimestamp()},{merge:true});
    unsubs.push(onSnapshot(query(collection(db,'chats'),where('members','array-contains',u.uid)),s=>{chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.lastTs)-ms(a.lastTs));render()}));
    unsubs.push(onSnapshot(query(collection(db,'stories'),where('ts','>',new Date(Date.now()-864e5)),orderBy('ts','desc')),s=>{stories=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
    unsubs.push(onSnapshot(query(collection(db,'posts'),orderBy('ts','desc'),limit(50)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  }
  render();
});
window.doAuth=async()=>{
  const e=$('#em').value.trim(),p=$('#pw').value,n=$('#nm')?.value.trim();err='';
  try{
    if(authMode==='up'){const c=await createUserWithEmailAndPassword(auth,e,p);const nn=n||e.split('@')[0];await updateProfile(c.user,{displayName:nn});await setDoc(doc(db,'users',c.user.uid),{name:nn},{merge:true});render()}
    else await signInWithEmailAndPassword(auth,e,p);
    fx(700,20);
  }catch(x){err={'auth/invalid-credential':'Email ou mot de passe incorrect','auth/email-already-in-use':'Email déjà utilisé','auth/weak-password':'Mot de passe : 6 caractères minimum'}[x.code]||x.code;render()}
};
window.swAuth=m=>{authMode=m;err='';ph.step='num';render()};
window.logout=()=>signOut(auth);

// --- Actions ---
window.openChat=id=>{
  cur=id;fx(560,8);unsubMsgs?.();
  unsubMsgs=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('ts'),limit(200)),s=>{
    const incoming=s.docChanges().some(c=>c.type==='added'&&c.doc.data().from!==me.uid&&!s.metadata.fromCache&&msgs.length);
    msgs=s.docs.map(d=>({id:d.id,...d.data()}));if(incoming)fx(880,[10,40,10]);render()});
  render();
};
window.closeChat=()=>{unsubMsgs?.();unsubMsgs=null;cur=null;msgs=[];emoOn=false;render()};
window.newChat=async()=>{
  const e=prompt('Numéro (avec indicatif, ex : +225…) ou email de ton contact :');if(!e)return;
  const v=e.trim().toLowerCase(),isM=v.includes('@'),val=isM?v:'+'+v.replace(/\D/g,'');
  const s=await getDocs(query(collection(db,'users'),where(isM?'email':'phone','==',val)));
  if(s.empty)return alert('Aucun utilisateur Mirage trouvé.');
  const o=s.docs[0],id=[me.uid,o.id].sort().join('_');
  await setDoc(doc(db,'chats',id),{members:[me.uid,o.id],names:{[me.uid]:me.displayName,[o.id]:o.data().name},auras:{[o.id]:o.data().aura||'🙂'},last:'',lastTs:serverTimestamp()},{merge:true});
  openChat(id);
};
async function post(c,data,preview){
  await addDoc(collection(db,'chats',c,'messages'),{from:me.uid,ts:serverTimestamp(),exp:S.eph?Date.now()+15000:0,...data});
  await updateDoc(doc(db,'chats',c),{last:preview,lastTs:serverTimestamp()});
}
window.send=async()=>{const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';fx(700,10);emoOn=false;await post(cur,{text:t},t);render()};
window.sendImg=async f=>{if(!f)return;fx(700,10);await post(cur,{img:await upload(f)},'📷 Photo')};
window.addE=e=>{const i=$('#mi');i.value+=e;vib(6);i.focus()};
window.publish=async()=>{
  const t=$('#pt').value.trim(),x=$('#px').value.trim();if(!t&&!x)return;
  await addDoc(collection(db,'posts'),{uid:me.uid,title:t||'Sans titre',text:x,img:pimg||'',likes:0,likedBy:[],ts:serverTimestamp(),by:me.displayName});
  pimg=null;compose=null;fx(900,[10,30,10]);render();
};
window.pickPost=async f=>{if(!f)return;$('#pv').textContent='Envoi…';pimg=await upload(f);$('#pv').innerHTML=`<img src="${pimg}" style="width:100%;border-radius:12px;margin-top:8px">`};
window.addStory=async()=>{const t=$('#stx').value.trim();if(!t)return;
  await addDoc(collection(db,'stories'),{uid:me.uid,who:me.displayName,e:S.aura,text:t,bg:sbg,ts:serverTimestamp()});compose=null;fx(900,20);render()};
window.like=async id=>{const p=posts.find(x=>x.id===id);if(p.likedBy?.includes(me.uid))return;fx(1000,12);await updateDoc(doc(db,'posts',id),{likes:increment(1),likedBy:arrayUnion(me.uid)})};
window.set=(k,v)=>{S[k]=v;saveS();fx(600,12);if(k==='aura'&&me)updateDoc(doc(db,'users',me.uid),{aura:v});render()};
window.go=t=>{tab=t;fx(520,8);render()};

// --- Téléphone, pays, vocal ---
const C=`CI|Côte d'Ivoire|225;SN|Sénégal|221;ML|Mali|223;BF|Burkina Faso|226;GN|Guinée|224;TG|Togo|228;BJ|Bénin|229;NE|Niger|227;CM|Cameroun|237;GA|Gabon|241;CG|Congo|242;CD|RD Congo|243;MA|Maroc|212;DZ|Algérie|213;TN|Tunisie|216;EG|Égypte|20;NG|Nigeria|234;GH|Ghana|233;KE|Kenya|254;ZA|Afrique du Sud|27;MG|Madagascar|261;FR|France|33;BE|Belgique|32;CH|Suisse|41;CA|Canada|1;US|États-Unis|1;GB|Royaume-Uni|44;DE|Allemagne|49;ES|Espagne|34;IT|Italie|39;PT|Portugal|351;BR|Brésil|55;HT|Haïti|509;IN|Inde|91;CN|Chine|86;JP|Japon|81;AE|Émirats arabes unis|971;SA|Arabie saoudite|966;LB|Liban|961;TR|Turquie|90;RU|Russie|7`.split(';').map(x=>x.split('|'));
const flag=cc=>String.fromCodePoint(...[...cc].map(c=>127397+c.charCodeAt()));
const ph={step:'num',ci:0,num:'',conf:null};
window.setCi=i=>{ph.ci=i;$('#pf').textContent='+'+C[i][2]};
window.sendCode=async()=>{
  const n=$('#tel').value.replace(/\D/g,'');ph.num=n;err='';
  if(n.length<6){err='Numéro invalide';return render()}
  try{
    window.rv?.clear?.();window.rv=new RecaptchaVerifier(auth,'rc',{size:'invisible'});
    ph.conf=await signInWithPhoneNumber(auth,'+'+C[ph.ci][2]+n,window.rv);ph.step='code';fx(700,15);
  }catch(x){err={'auth/invalid-phone-number':'Numéro invalide','auth/too-many-requests':'Trop d\'essais, réessaie plus tard','auth/operation-not-allowed':'Active « Téléphone » dans Firebase Authentication','auth/captcha-check-failed':'Vérification anti-robot échouée'}[x.code]||x.code;window.rv?.clear?.();window.rv=null}
  render();
};
window.verifyCode=async()=>{err='';try{await ph.conf.confirm($('#code').value.trim());fx(700,20);ph.step='num'}catch(x){err=x.code==='auth/invalid-verification-code'?'Code incorrect':x.code;render()}};
window.backNum=()=>{ph.step='num';err='';render()};
window.saveName=async()=>{const n=$('#nm').value.trim();if(!n)return;await updateProfile(me,{displayName:n});await setDoc(doc(db,'users',me.uid),{name:n},{merge:true});fx(700,20);render()};
function authScreen(){
  const E=`<p style="color:#e0457b;min-height:20px;font-size:13px;margin:6px 0">${esc(err)}</p>`,lk=(m,t)=>`<p style="margin-top:14px"><a href="#" onclick="swAuth('${m}');return false" style="color:var(--ac)">${t}</a></p>`;
  let f='';
  if(me&&!me.displayName)f=`<p style="margin-bottom:10px">Dernière étape : comment t'appelles-tu ?</p><input class="f" id="nm" placeholder="Ton prénom">${E}<button class="btn" onclick="saveName()">Continuer</button>`;
  else if(authMode==='phone'&&ph.step==='num')f=`<select class="f" onchange="setCi(this.selectedIndex)">${C.map((c,i)=>`<option ${i===ph.ci?'selected':''}>${flag(c[0])} ${c[1]} (+${c[2]})</option>`).join('')}</select><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><b id="pf">+${C[ph.ci][2]}</b><input class="f" id="tel" type="tel" inputmode="tel" placeholder="Numéro de téléphone" value="${esc(ph.num)}"></div>${E}<button class="btn" onclick="sendCode()">Envoyer le code</button>${lk('in','Utiliser un email')}`;
  else if(authMode==='phone')f=`<p style="margin-bottom:10px">Code envoyé au <b>+${C[ph.ci][2]} ${esc(ph.num)}</b></p><input class="f" id="code" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;letter-spacing:8px;font-size:20px">${E}<button class="btn" onclick="verifyCode()">Valider</button><p style="margin-top:14px"><a href="#" onclick="backNum();return false" style="color:var(--ac)">Changer de numéro</a></p>`;
  else f=`${authMode==='up'?'<input class="f" id="nm" placeholder="Prénom" style="margin-bottom:8px">':''}<input class="f" id="em" type="email" placeholder="Email" style="margin-bottom:8px"><input class="f" id="pw" type="password" placeholder="Mot de passe">${E}<button class="btn" onclick="doAuth()">${authMode==='up'?'Créer mon compte':'Connexion'}</button>${lk(authMode==='up'?'in':'up',authMode==='up'?'J\'ai déjà un compte':'Créer un compte email')}${lk('phone','Utiliser mon numéro de téléphone')}`;
  return `<div class="hello"><div style="width:100%;max-width:320px"><div style="width:96px;height:96px;margin:auto">${LOGO}</div><h1 style="margin:14px 0 4px;font-size:34px">Mirage</h1><p style="color:var(--mu);margin-bottom:16px">Messagerie réelle, éphémère, à toi.</p>${f}</div></div>`;
}
let rec=null,recT=null,recS=0;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
window.startRec=async()=>{
  if(rec)return;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    const r=new MediaRecorder(s,mt?{mimeType:mt}:{}),ch=[];r.ondataavailable=e=>ch.push(e.data);
    rec={r,ch,send:false,dur:0,mt:(r.mimeType||mt||'audio/webm')};
    r.onstop=async()=>{
      s.getTracks().forEach(t=>t.stop());clearInterval(recT);const o=rec;rec=null;render();
      if(o.send&&ch.length&&o.dur>0){
        const b=new Blob(ch,{type:o.mt}),rf=ref(st,`u/${me.uid}/${Date.now()}.${o.mt.includes('mp4')?'m4a':'webm'}`);
        await uploadBytes(rf,b,{contentType:o.mt.split(';')[0]});
        await post(cur,{audio:await getDownloadURL(rf),dur:o.dur},'🎤 Vocal');
      }
    };
    r.start();recS=0;fx(500,30);
    recT=setInterval(()=>{recS++;const e=$('#rt');if(e)e.textContent=fmt(recS)},1000);
    render();
  }catch(e){alert('Micro non autorisé ou indisponible.')}
};
window.stopRec=send=>{if(!rec)return;rec.send=send;rec.dur=recS;fx(send?800:400,15);rec.r.stop()};

// --- Rendu ---
const sw=(t,d,k)=>`<div class="sw"><div>${t}<small>${d}</small></div><button class="tg ${S[k]?'on':''}" onclick="set('${k}',!S['${k}'])"></button></div>`;
const other=c=>{const id=c.members.find(m=>m!==me.uid);return{name:c.names?.[id]||'Contact',e:c.auras?.[id]||'🙂'}};
function render(){
  theme();const A=$('#app'),keep=$('#mi')?.value||'',focus=document.activeElement?.id==='mi',tx=[$('#pt')?.value,$('#px')?.value,$('#stx')?.value];
  if(!me||!me.displayName){A.innerHTML=authScreen();return}
  let b='';
  if(tab==='chats')b=`<div class="stories"><div onclick="compose='story';render()"><div class="av" style="font-size:26px">＋</div>Ma story</div>${stories.map(s=>`<div onclick="story='${s.id}';render()"><div class="av ring">${esc(s.e)}</div>${esc(s.who)}</div>`).join('')}</div>`
    +(chats.map(c=>{const o=other(c);return`<div class="row" onclick="openChat('${c.id}')"><div class="av">${esc(o.e)}</div><div class="grow"><b>${esc(o.name)}</b><small>${esc(c.last||'Dis bonjour 👋')}</small></div><small style="color:var(--mu)">${c.last?ago(c.lastTs):''}</small></div>`}).join('')||'<p style="padding:24px;color:var(--mu);text-align:center">Aucune discussion.<br>Appuie sur ✚ pour inviter un contact par email.</p>');
  if(tab==='channels')b=posts.map(p=>`<div class="card"><b>${esc(p.title)}</b><div style="color:var(--mu);font-size:12px">${esc(p.by||'')} · ${new Date(ms(p.ts)).toLocaleDateString('fr')}</div><p style="margin-top:6px">${esc(p.text)}</p>${p.img?`<img src="${esc(p.img)}" loading="lazy">`:''}<div style="margin-top:8px"><button class="ib" onclick="like('${p.id}')">${p.likedBy?.includes(me.uid)?'❤️':'🤍'} <small>${p.likes||0}</small></button></div></div>`).join('')||'<p style="padding:24px;color:var(--mu)">Aucun post. Publie le premier !</p>';
  if(tab==='settings')b=`<div class="card" style="text-align:center"><div class="av" style="margin:auto;width:70px;height:70px;font-size:34px">${S.aura}</div><h2 style="margin-top:8px">${esc(me.displayName)}</h2><small style="color:var(--mu)">${esc(me.email||me.phoneNumber)} · Aura du jour</small><div class="emo" style="background:none;border:0">${['😎','🥰','🤩','😴','🔥','🌙','🧘','🎧'].map(e=>`<span onclick="set('aura','${e}')">${e}</span>`).join('')}</div></div>
    ${sw('Sons','Bips à l\'envoi et à la réception','sound')}${sw('Vibrations','Retour haptique','vib')}${sw('Messages éphémères','Tes nouveaux messages s\'évaporent en 15 s','eph')}
    <div class="sw"><div>Thème</div><button class="btn" onclick="set('dark',{auto:'light',light:'dark',dark:'auto'}[S.dark])">${{auto:'Auto',light:'Clair',dark:'Sombre'}[S.dark]}</button></div>
    <div class="sw" style="display:block"><div>Couleur d'accent</div><div class="dots">${COL.map(c=>`<span style="background:${c};border-color:${c===S.accent?'var(--tx)':'transparent'}" onclick="set('accent','${c}')"></span>`).join('')}</div></div>
    <div class="sw"><div>Session</div><button class="btn" style="background:#e0457b" onclick="logout()">Déconnexion</button></div>`;
  const fab=tab==='channels'?`<button class="fab" onclick="compose='post';render()">✍️</button>`:tab==='chats'?`<button class="fab" onclick="newChat()">✚</button>`:'';
  A.innerHTML=`<header><div style="width:34px;height:34px">${LOGO}</div><h1>${{chats:'Mirage',channels:'Chaînes',settings:'Réglages'}[tab]}</h1></header><main>${b}</main>${fab}<nav>${[['chats','💬','Discussions'],['channels','📣','Chaînes'],['settings','⚙️','Réglages']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('')}</nav>${overlays()}`;
  const m=$('.msgs');if(m)m.scrollTop=m.scrollHeight;
  const i=$('#mi');if(i){i.value=keep;if(focus)i.focus()}
  if($('#pt')){$('#pt').value=tx[0]||'';$('#px').value=tx[1]||''}if($('#stx'))$('#stx').value=tx[2]||'';
}
function overlays(){
  let h='';
  if(cur){const c=chats.find(x=>x.id===cur),o=c?other(c):{name:'…',e:'🙂'},now=Date.now();
    h+=`<div class="over"><header><button class="ib" onclick="closeChat()">←</button><div class="av" style="width:38px;height:38px;font-size:18px">${esc(o.e)}</div><h1 style="font-size:18px">${esc(o.name)}</h1>${S.eph?'<small style="color:var(--ac)">⏳ éphémère</small>':''}</header>
    <div class="msgs">${msgs.filter(m=>!m.exp||m.exp>now).map(m=>`<div class="m ${m.from===me.uid?'me':''} ${m.exp?'eph':''}">${m.img?`<img src="${esc(m.img)}">`:m.audio?`<audio controls preload="none" src="${esc(m.audio)}"></audio>`:esc(m.text)}<i>${ago(m.ts)}</i></div>`).join('')}</div>
    ${emoOn?`<div class="emo">${EMO.map(e=>`<span onclick="addE('${e}')">${e}</span>`).join('')}</div>`:''}
    ${rec?`<div class="bar"><button class="ib" onclick="stopRec(false)">🗑️</button><span class="recdot">●</span><b id="rt">0:00</b><div class="grow"></div><button class="ib send" onclick="stopRec(true)">➤</button></div>`:`<div class="bar"><button class="ib" onclick="emoOn=!emoOn;render()">😊</button><label class="ib">📎<input type="file" accept="image/*" hidden onchange="sendImg(this.files[0])"></label><input type="text" id="mi" placeholder="Message" onkeydown="if(event.key==='Enter')send()"><button class="ib send" style="background:var(--them);color:var(--tx)" onclick="startRec()">🎤</button><button class="ib send" onclick="send()">➤</button></div>`}</div>`}
  if(compose==='post')h+=`<div class="over"><header><button class="ib" onclick="compose=null;render()">✕</button><h1 style="font-size:18px">Nouveau post</h1></header><div style="padding:12px"><input class="f" id="pt" placeholder="Titre"><textarea id="px" rows="5" placeholder="Écris ton post…"></textarea><div id="pv"></div><div style="margin-top:12px;display:flex;gap:10px"><label class="btn" style="background:var(--them);color:var(--tx)">📷 Upload<input type="file" accept="image/*" hidden onchange="pickPost(this.files[0])"></label><button class="btn" onclick="publish()">Publier 🚀</button></div></div></div>`;
  if(compose==='story')h+=`<div class="over"><header><button class="ib" onclick="compose=null;render()">✕</button><h1 style="font-size:18px">Nouvelle story</h1></header><div style="padding:12px"><textarea id="stx" rows="4" placeholder="Ta story…" style="font-size:20px"></textarea><div class="dots" id="sb">${BG.map((c,i)=>`<span style="background:${c};border-color:${i?'transparent':'var(--tx)'}" onclick="sbg='${c}';[...$('#sb').children].forEach(x=>x.style.borderColor='transparent');this.style.borderColor='var(--tx)'"></span>`).join('')}</div><button class="btn" style="margin-top:16px" onclick="addStory()">Partager ✨</button></div></div>`;
  if(story){const s=stories.find(x=>x.id===story);if(s){h+=`<div class="sv" style="background:${esc(s.bg)}" onclick="story=null;render()"><div class="p"><i></i></div><small>${esc(s.e)} ${esc(s.who)}</small>${esc(s.text)}</div>`;const id=story;setTimeout(()=>{if(story===id){story=null;render()}},5000)}}
  return h;
}
window.$=$;window.render=render;
Object.defineProperties(window,{compose:{get:()=>compose,set:v=>compose=v},story:{get:()=>story,set:v=>story=v},emoOn:{get:()=>emoOn,set:v=>emoOn=v},S:{get:()=>S},sbg:{get:()=>sbg,set:v=>sbg=v}});
setInterval(()=>{if(cur&&S.eph&&msgs.some(m=>m.exp))render()},4000);

// PWA : manifeste généré (aucun fichier externe)
{const ic='data:image/svg+xml,'+encodeURIComponent(ICON);
const mf={name:'Mirage',short_name:'Mirage',display:'standalone',background_color:'#7c5cff',theme_color:'#7c5cff',start_url:location.pathname,icons:[{src:ic,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l);
const f=document.createElement('link');f.rel='icon';f.href=ic;document.head.appendChild(f);
const a=document.createElement('link');a.rel='apple-touch-icon';a.href=ic;document.head.appendChild(a)}

render();

</script>
